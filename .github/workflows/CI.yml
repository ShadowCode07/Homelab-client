name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with the vcpkg submodule)
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool

      - name: Read vcpkg version
        id: vcpkg
        run: echo "commit=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure (installs Paho through vcpkg)
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug


  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository (with the vcpkg submodule)
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool clang-tidy

      - name: Read vcpkg version
        id: vcpkg
        run: echo "commit=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure (writes compile_commands.json for clang-tidy)
        run: cmake --preset linux-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy (uses the checks in .clang-tidy)

        run: clang-tidy -p out/build/linux-debug src/*.cpp
